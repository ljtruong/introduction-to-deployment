[project]
name = "backend"
version = "0.1.0"
description = "Python backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "pydantic-settings>=2.13.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
